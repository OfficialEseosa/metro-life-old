<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f0" />
    <meta name="color-scheme" content="light" />
    <title>Metro Life — a city of possibilities</title>
    <meta
      name="description"
      content="Build a life in Atlanta, New York and the Bay Area. Explore, make friends and find your next chapter."
    />
    <meta name="application-name" content="Metro Life" />
    <meta property="og:title" content="Metro Life — a city of possibilities" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312784a'/%3E%3Cpath d='M8 21.5 6.5 11.5l5.5 4 4-6.5 4 6.5 5.5-4L24 21.5Z' fill='%23fff'/%3E%3Crect x='8' y='23' width='16' height='2' rx='1' fill='%23f0b24a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="startup" role="status" aria-live="polite">
      <div class="startup-card"><span class="startup-spinner" aria-hidden="true"></span><h1>Metro Life</h1><p id="startup-message">Opening your city…</p><button id="startup-reload" hidden onclick="location.reload()">Reload Metro Life</button></div>
    </div>
    <style>
      #startup{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fbf5e9;color:#253e35;font-family:system-ui,sans-serif;text-align:center}#startup .startup-card{max-width:380px}#startup h1{font-size:40px;margin:20px 0 10px;letter-spacing:-1px}#startup p{line-height:1.6}#startup button{border:0;border-radius:999px;background:#2fa36b;color:#fff;font:600 16px system-ui;padding:14px 24px;cursor:pointer}#startup button:focus-visible{outline:3px solid #253e35;outline-offset:4px}.startup-spinner{display:inline-block;width:36px;height:36px;border:4px solid #d6e8d9;border-top-color:#2fa36b;border-radius:50%;animation:startup-spin 1s linear infinite}@keyframes startup-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.startup-spinner{animation:none}}
    </style>
    <script>
      (() => {
        const overlay = document.getElementById('startup');
        const timeout = setTimeout(() => {
          if (!overlay.isConnected) return;
          overlay.setAttribute('role', 'alert');
          document.getElementById('startup-message').textContent = 'Metro Life failed to start, please reload';
          document.getElementById('startup-reload').hidden = false;
          overlay.querySelector('.startup-spinner').style.display = 'none';
        }, 8000);
        window.addEventListener('metro-mounted', () => { clearTimeout(timeout); overlay.remove(); }, { once: true });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
