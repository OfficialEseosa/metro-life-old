spring.application.name=metro-life
server.port=${PORT:8080}
metro.data=${METRO_DATA:data/metro-life.json}
spring.jackson.default-property-inclusion=always
server.error.include-message=never
server.tomcat.max-http-form-post-size=32KB

# Browser origins allowed to call the API with credentials and to open the socket.
# Comma separated; exact origins or patterns such as https://*.vercel.app or http://localhost:[*].
metro.origins=${METRO_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
metro.ws.origins=${metro.origins}

# Trust X-Forwarded-* from the hosting proxy so HTTPS is detected behind TLS termination.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# The API does not serve the frontend. To play from one address locally, point this at a built
# frontend, for example METRO_STATIC_LOCATIONS=file:../frontend/dist/
spring.web.resources.static-locations=${METRO_STATIC_LOCATIONS:classpath:/static/}

# Compress JSON responses (the world document and sim snapshots are tens of kilobytes).
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
